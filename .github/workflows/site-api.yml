name: Deploy site API

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Publish the API with the key kept in Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SKYCIV_USERNAME: ${{ secrets.SKYCIV_USERNAME }}
          SKYCIV_KEY: ${{ secrets.SKYCIV_KEY }}
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$SKYCIV_USERNAME" ] || [ -z "$SKYCIV_KEY" ]; then
            echo "A repository admin needs to set FLY_API_TOKEN, SKYCIV_USERNAME, and SKYCIV_KEY, then run this workflow again."
            exit 1
          fi
          flyctl secrets set SKYCIV_USERNAME="$SKYCIV_USERNAME" SKYCIV_KEY="$SKYCIV_KEY" --stage
          flyctl deploy --remote-only --ha=false

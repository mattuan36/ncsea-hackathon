# fly.toml app configuration file generated for ncsea-hackathon on 2026-10-28T00:06:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ncsea-hackathon'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  API_CORS_ORIGINS = 'https://mattuan36.github.io,http://localhost:5180,http://127.0.0.1:5180'
  LTL_INPUTS_DIR = '/data/inputs'
  LTL_MODELS_DIR = '/data/models'

[[mounts]]
  source = 'ncsea_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

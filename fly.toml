app = "ncsea-hackathon-site-api"
primary_region = "sjc"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# IFC uploads and extraction logs live on this volume so they survive deploys.
# Create it once: fly volumes create ncsea_data --region sjc --size 3
[mounts]
  source = "ncsea_data"
  destination = "/data"

# ifcopenshell meshes whole models; 256 MB is not enough.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

# DATABASE_URL (Supabase Postgres) is a Fly secret, never set here.
[env]
  LTL_MODELS_DIR = "/data/models"
  LTL_INPUTS_DIR = "/data/inputs"
  API_CORS_ORIGINS = "https://mattuan36.github.io,http://localhost:5180,http://127.0.0.1:5180"

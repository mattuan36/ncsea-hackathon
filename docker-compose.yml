services:
  db:
    image: postgres:16-alpine
    container_name: structural-app-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: structural_app
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d structural_app"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
